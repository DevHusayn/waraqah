<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <script>
        (function () {
            try {
                var mode = localStorage.getItem('waraqah_theme_mode');
                if (mode !== 'light') {
                    document.documentElement.classList.add('dark');
                }
                if (localStorage.getItem('waraqah_sidebar_collapsed') === '1') {
                    document.documentElement.classList.add('sidebar-collapsed');
                }
            } catch (_) { }
        })();
    </script>
    <script>
        (function () {
            try {
                var standalone =
                    window.navigator.standalone === true ||
                    window.matchMedia('(display-mode: standalone)').matches ||
                    window.matchMedia('(display-mode: fullscreen)').matches ||
                    window.matchMedia('(display-mode: minimal-ui)').matches;

                if (!standalone) {
                    return;
                }

                var nav = performance.getEntriesByType('navigation')[0];
                var navType = nav && nav.type ? nav.type : 'navigate';
                var warm =
                    navType === 'reload' ||
                    navType === 'back_forward' ||
                    sessionStorage.getItem('waraqah_pwa_session_alive') === '1';

                if (warm) {
                    return;
                }

                document.documentElement.classList.add('pwa-cold-start');
            } catch (_) { }
        })();
    </script>
    <meta name="color-scheme" content="light dark" />
    <style id="pwa-cold-start-styles">
        html.pwa-cold-start,
        html.pwa-cold-start body,
        html.pwa-cold-start #root {
            background-color: #16A34A !important;
        }

        html.pwa-cold-start #root {
            visibility: hidden;
        }
    </style>
    <link rel="icon" type="image/svg+xml" href="/brand/waraqah-logo.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16A34A" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Waraqah" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Brand wordmark (Bodoni Moda 600): sync + preload to avoid Georgia fallback flashing bold -->
    <link
        rel="preload"
        as="font"
        type="font/woff2"
        crossorigin
        href="https://fonts.gstatic.com/s/bodonimoda/v28/aFTH7PxzY382XsXX63LUYL6GYFksw-NIrKp-cv31KOxQ.woff2" />
    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,600&display=block"
        rel="stylesheet" />
    <!-- UI body text: async load is fine -->
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet" />
    </noscript>
    <title>Waraqah. Get Paid. Keep Records.</title>
    <meta name="description"
        content="Waraqah. Quotations, invoices, receipts, and business records. Manage clients and products, create polished PDFs, export CSV reports, email clients, and track what's paid." />
    <meta name="application-name" content="Waraqah" />
    <meta property="og:title" content="Waraqah. Get Paid. Keep Records." />
    <meta property="og:site_name" content="Waraqah" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
</body>

</html>
